<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where is Burgos? – splash mockup</title>
<style>
:root{--bg:#fff3d6;--ink:#2a2140;--sea:#dbe9f4}
@media(prefers-color-scheme:dark){:root{--bg:#232033;--ink:#f4efe0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
 background:radial-gradient(circle at 50% 40%,var(--bg) 0 45%,rgba(255,200,80,.35) 100%);animation:out .4s ease 4.6s forwards;cursor:pointer}
@keyframes out{to{opacity:0;visibility:hidden}}
h1{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.04em 0;padding:0 4vw;
 font:900 clamp(40px,10vw,110px)/1 "Chalkboard SE","Marker Felt","Comic Sans MS","Comic Neue",cursive;letter-spacing:.01em}
h1 .w{display:flex;margin:0 .22em}
h1 span{display:inline-block;opacity:0;transform:translateY(-120%) rotate(-30deg) scale(.3);
 -webkit-text-stroke:.05em var(--ink);paint-order:stroke fill;text-shadow:.04em .06em 0 var(--ink);
 animation:pop .55s cubic-bezier(.3,1.6,.5,1) forwards,wob 1.4s ease-in-out infinite alternate;
 animation-delay:calc(var(--i)*70ms),calc(var(--i)*70ms + .6s)}
@keyframes pop{to{opacity:1;transform:translateY(0) rotate(var(--r)) scale(var(--s))}}
@keyframes wob{from{transform:translateY(0) rotate(var(--r)) scale(var(--s))}to{transform:translateY(-.08em) rotate(calc(var(--r)*-1)) scale(var(--s))}}
svg{width:min(46vw,300px);height:auto;overflow:visible}
#guy{animation:drop .7s cubic-bezier(.3,1.5,.5,1) .5s both}
@keyframes drop{from{transform:translateY(60px);opacity:0}}
#q{transform-origin:150px 60px;animation:qpop .5s cubic-bezier(.3,1.8,.5,1) 1.1s both,qbob 1s ease-in-out 1.6s infinite alternate}
@keyframes qpop{from{transform:scale(0) rotate(-40deg);opacity:0}}
@keyframes qbob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-8px) rotate(6deg)}}
#pupils{animation:look 2.4s ease-in-out 1.2s infinite}
@keyframes look{0%,100%{transform:translate(0,0)}35%{transform:translate(-4px,-3px)}70%{transform:translate(4px,-4px)}}
#brow{transform-origin:178px 118px;animation:brow 1.6s ease-in-out 1.2s infinite alternate}
@keyframes brow{to{transform:translateY(-5px) rotate(-6deg)}}
#sweat{animation:sweat 1.2s ease-in 1.4s infinite}
@keyframes sweat{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.bar{width:min(60vw,360px);height:10px;border-radius:6px;background:rgba(0,0,0,.15);overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;width:0;background:#f0a21a;animation:fill 4.6s linear forwards}
@keyframes fill{to{width:100%}}
#after{display:none;text-align:center}
#after.show{display:block}
button{font:inherit;padding:10px 16px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:#2a2140;cursor:pointer;margin-top:12px}
.note{font-size:12px;opacity:.7;margin-top:6px}
@media(prefers-reduced-motion:reduce){h1 span,#guy,#q,#pupils,#brow,#sweat{animation:none;opacity:1;transform:rotate(var(--r))}#q,#guy{transform:none}}
</style>
</head>
<body>
<div id="splash" title="Click or press space to skip">
 <h1 id="title" aria-label="Where is Burgos?"></h1>
 <svg viewBox="0 0 300 260" aria-hidden="true">
  <g id="guy">
   <!-- body -->
   <path d="M85 260 Q90 195 150 190 Q210 195 215 260Z" fill="#3b82d6" stroke="#2a2140" stroke-width="5" stroke-linejoin="round"/>
   <path d="M130 192 L150 215 L170 192" fill="#fff" stroke="#2a2140" stroke-width="4" stroke-linejoin="round"/>
   <!-- hand on chin -->
   <ellipse cx="205" cy="190" rx="18" ry="14" fill="#ffd2a8" stroke="#2a2140" stroke-width="4"/>
   <!-- head -->
   <ellipse cx="150" cy="130" rx="68" ry="66" fill="#ffd2a8" stroke="#2a2140" stroke-width="5"/>
   <!-- hair -->
   <path d="M88 105 Q100 52 150 62 Q205 54 212 108 Q185 82 150 88 Q115 84 88 105Z" fill="#6b3f1d" stroke="#2a2140" stroke-width="5" stroke-linejoin="round"/>
   <path d="M146 62 Q138 38 156 34" fill="none" stroke="#2a2140" stroke-width="5" stroke-linecap="round"/>
   <!-- ears -->
   <circle cx="82" cy="135" r="9" fill="#ffd2a8" stroke="#2a2140" stroke-width="4"/>
   <circle cx="218" cy="135" r="9" fill="#ffd2a8" stroke="#2a2140" stroke-width="4"/>
   <!-- eyes -->
   <circle cx="122" cy="128" r="19" fill="#fff" stroke="#2a2140" stroke-width="4"/>
   <circle cx="180" cy="128" r="22" fill="#fff" stroke="#2a2140" stroke-width="4"/>
   <g id="pupils"><circle cx="124" cy="123" r="7" fill="#2a2140"/><circle cx="182" cy="122" r="8" fill="#2a2140"/></g>
   <!-- eyebrows: one flat, one raised -->
   <path d="M100 102 L140 104" stroke="#2a2140" stroke-width="6" stroke-linecap="round"/>
   <path id="brow" d="M160 98 Q180 84 202 96" fill="none" stroke="#2a2140" stroke-width="6" stroke-linecap="round"/>
   <!-- mouth: wavy "hmm" -->
   <path d="M122 168 Q132 160 142 168 T164 168 T184 166" fill="none" stroke="#2a2140" stroke-width="5" stroke-linecap="round"/>
   <!-- sweat -->
   <path id="sweat" d="M227 92 Q237 108 227 114 Q217 108 227 92Z" fill="#7cc4ff" stroke="#2a2140" stroke-width="3"/>
  </g>
  <!-- question mark -->
  <g id="q">
   <path d="M120 38 Q118 4 150 4 Q184 4 182 34 Q181 52 160 64 Q148 72 150 88" fill="none" stroke="#2a2140" stroke-width="22" stroke-linecap="round"/>
   <path d="M120 38 Q118 4 150 4 Q184 4 182 34 Q181 52 160 64 Q148 72 150 88" fill="none" stroke="#f0a21a" stroke-width="12" stroke-linecap="round"/>
   <circle cx="150" cy="116" r="13" fill="#2a2140"/><circle cx="150" cy="116" r="7" fill="#f0a21a"/>
  </g>
 </svg>
 <div class="bar"><i></i></div>
</div>
<div id="after"><h2>(menu screen would appear here)</h2><button id="replay">▶ Replay splash</button><p class="note">Splash auto-closes after 5 s · click or space skips it</p></div>
<script>
const colors=["#ef4444","#f59e0b","#22c55e","#3b82f6","#a855f7","#ec4899","#14b8a6"];
const rot=[-8,6,-4,9,-6,5,-9,4,-5];
function build(){
 const h=document.getElementById("title");h.innerHTML="";let i=0;
 "Where is Burgos?".split(" ").forEach(w=>{
  const g=document.createElement("div");g.className="w";
  [...w].forEach(ch=>{const s=document.createElement("span");s.textContent=ch;
   s.style.setProperty("--i",i);s.style.setProperty("--r",rot[i%rot.length]+"deg");
   s.style.setProperty("--s",ch==="?"?1.25:(i%3==0?1.1:1));
   s.style.color=colors[i%colors.length];g.appendChild(s);i++});
  h.appendChild(g)});
}
let timer;
function done(){document.getElementById("splash").style.display="none";document.getElementById("after").classList.add("show");clearTimeout(timer)}
function play(){
 const old=document.getElementById("splash"),n=old.cloneNode(true);old.replaceWith(n);
 n.style.display="";n.addEventListener("click",done);
 document.getElementById("after").classList.remove("show");
 const c=document.getElementById("title");
 build();
 clearTimeout(timer);timer=setTimeout(done,5000);
}
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!document.getElementById("after").classList.contains("show")){e.preventDefault();done()}});
document.getElementById("replay").addEventListener("click",play);
build();
document.getElementById("splash").addEventListener("click",done);
timer=setTimeout(done,5000);
</script>
</body>
</html>
